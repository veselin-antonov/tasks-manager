services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tasks-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    volumes:
      - ./data:/app/data
    expose:
      - '3001'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tasks-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '7457:80'
